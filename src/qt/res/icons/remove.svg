<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rm_warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#ff4a3d"/>
    </linearGradient>
    <radialGradient id="rm_core" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="rm_glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- soft warm halo -->
  <circle cx="16" cy="16" r="13" fill="url(#rm_core)"/>
  <!-- ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#rm_warm)" stroke-width="1.6" opacity="0.85"/>
  <!-- the X -->
  <g filter="url(#rm_glow)" stroke="url(#rm_warm)" stroke-width="2.6" stroke-linecap="round">
    <line x1="11" y1="11" x2="21" y2="21"/>
    <line x1="21" y1="11" x2="11" y2="21"/>
  </g>
</svg>
