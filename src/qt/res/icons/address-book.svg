<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ab_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#ff7a3d"/>
    </linearGradient>
    <linearGradient id="ab_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="ab_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- book spine accent -->
  <rect x="5" y="5" width="3" height="22" rx="1" fill="url(#ab_cyan)"/>
  <!-- book body -->
  <g filter="url(#ab_glow)">
    <rect x="8" y="4" width="18" height="24" rx="2"
          fill="none" stroke="url(#ab_gold)" stroke-width="1.8"/>
    <!-- contact silhouette: head + shoulders -->
    <circle cx="17" cy="13" r="2.6" fill="none" stroke="url(#ab_gold)" stroke-width="1.4"/>
    <path d="M11.5 22 C 12 18.5  15 17  17 17  C 19 17  22 18.5  22.5 22 Z"
          fill="none" stroke="url(#ab_gold)" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- bookmark tab on right edge -->
    <path d="M26 8 L29 8 L29 14 L27.5 12.5 L26 14 Z"
          fill="url(#ab_gold)" opacity="0.85"/>
  </g>
</svg>
