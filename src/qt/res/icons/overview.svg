<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#8b5cff"/>
    </linearGradient>
    <linearGradient id="g_gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#ff7a3d"/>
    </linearGradient>
    <linearGradient id="g_magenta" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2cd5"/>
      <stop offset="100%" stop-color="#8b5cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- frame -->
  <rect x="14" y="14" width="52" height="52" rx="10" fill="none" stroke="url(#g_cyan)" stroke-width="2" opacity="0.6"/>
  <!-- bars: small to large with neon gradient and glow -->
  <g filter="url(#glow)">
    <rect x="22" y="44" width="7"  height="14" rx="2" fill="url(#g_cyan)"/>
    <rect x="33" y="36" width="7"  height="22" rx="2" fill="url(#g_magenta)"/>
    <rect x="44" y="28" width="7"  height="30" rx="2" fill="url(#g_gold)"/>
    <rect x="55" y="22" width="7"  height="36" rx="2" fill="url(#g_cyan)"/>
  </g>
  <!-- ground line -->
  <rect x="20" y="60" width="40" height="2" rx="1" fill="#e7ecff" opacity="0.45"/>
</svg>
